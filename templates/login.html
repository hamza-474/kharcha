{% extends "layout.html" %}
{% block title %}Log in{% endblock %}
{% block main %}
<div class="auth-wrap">
  <section class="card auth-card rise d1">
    <div class="auth-head">
      <span class="brand-mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      </span>
      <h1>Welcome back</h1>
      <p>Log in to see where your money went.</p>
    </div>
    <form method="post" action="{{ url_for('login') }}">
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New to Kharcha? <a href="{{ url_for('register') }}">Create a free account</a></p>
  </section>
</div>
{% endblock %}
