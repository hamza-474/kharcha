{% extends "layout.html" %}
{% block title %}Add entry{% endblock %}
{% block main %}
<div class="page-head">
  <h1>Add entry</h1>
  <p>It takes ten seconds — future you says thanks.</p>
</div>

<section class="card form-card rise d1">
  <form method="post" action="{{ url_for('add') }}">
    <div class="field">
      <label>Type</label>
      <div class="seg" role="radiogroup" aria-label="Entry type">
        <span><input type="radio" id="kind-expense" name="kind" value="expense" checked><label class="seg-out" for="kind-expense">− Expense</label></span>
        <span><input type="radio" id="kind-income" name="kind" value="income"><label class="seg-in" for="kind-income">+ Income</label></span>
      </div>
    </div>

    <div class="field">
      <label for="amount">Amount (Rs)</label>
      <input class="input amount-input" id="amount" name="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required autofocus>
    </div>

    <div class="field">
      <label for="category">Category</label>
      <select class="input" id="category" name="category">
        {% for c in categories %}
        <option value="{{ c }}" {% if c == 'Food' %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label for="note">Note <span style="color: var(--ink-soft); font-weight: 500">(optional)</span></label>
      <input class="input" id="note" name="note" type="text" maxlength="120" placeholder="e.g. Groceries at the market">
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input class="input" id="date" name="date" type="date" value="{{ today }}" max="{{ today }}" required>
      <p class="help">Entries are checked on the server too: the amount must be positive and the date cannot be in the future.</p>
    </div>

    <div class="form-foot">
      <button class="btn btn-primary" type="submit">Save entry</button>
      <a class="btn btn-ghost" href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
